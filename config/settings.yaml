# Anti-Forensics Detector settings.
# Environment variables override these paths:
#   AFD_EVIDENCE_DIR, AFD_CASES_DIR

paths:
  # Keep both outside OneDrive-synced folders (Desktop, Documents, Pictures).
  evidence_dir: 'C:\forensics\evidence'   # images and exported artifacts (read-only input)
  cases_dir: 'C:\forensics\cases'         # per-case output: custody log, exports, reports

# Detection thresholds are added here in Stage 3 onwards.

# ---------------------------------------------------------------- Stage 3 detectors
# Every value below is the built-in default; delete a line to fall back to it.
# Scores add up; the totals are mapped to LOW / MEDIUM / HIGH with medium_at / high_at.
detection:
  timestomp:
    tolerance_seconds: 2.0              # $SI vs $FN differences below this are ignored
    mft_change_tolerance_seconds: 60.0  # $SI "MFT changed" this much after $FN created = edited later
    future_margin_days: 1.0             # $SI dates further than this past the newest $FN date are impossible
    first_user_entry: 24                # MFT entries 0-23 are NTFS system files; skipped
    medium_at: 4
    high_at: 6
    weights:
      si_before_fn: 3          # core: $SI created is earlier than $FN created
      si_zeroed: 3             # core: $SI created and modified are zero
      future: 4                # core: $SI date is in the future
      zero_subsecond: 2        # $SI whole seconds but $FN has fractions
      changed_after_arrival: 1 # $SI "MFT changed" long after arrival, write time before arrival
      donor_match: 2           # $SI dates identical to a Windows system file
      suspicious_path: 1       # file is in a temp / public / recycle-bin style folder
      bulk_pattern: -3         # many similar files arrived together (installer / archive)
      benign_path: -1          # file is under Program Files, WinSxS and similar
    bulk_min_files: 8          # this many flagged files in one folder ...
    bulk_window_seconds: 120   # ... that arrived within this many seconds = bulk pattern
    volume_burst_min_files: 50       # this many flagged files anywhere on the volume ...
    volume_burst_window_seconds: 300 # ... arriving within this window = setup / update burst
    include_directories: false       # folders' "MFT changed" moves on every new file: skip them
    benign_path_prefixes:
      - '\program files\'
      - '\program files (x86)\'
      - '\windows\winsxs\'
      - '\windows\servicing\'
      - '\windows\installer\'
      - '\windows\softwaredistribution\'
      - '\windows\system32\driverstore\'
      - '\programdata\package cache\'
      - '\programdata\microsoft\'
    suspicious_path_fragments:
      - '\windows\temp\'
      - '\users\public\'
      - '\appdata\local\temp\'
      - '\$recycle.bin\'
    donor_path_prefixes:
      - '\windows\system32\'
      - '\windows\syswow64\'
      - '\windows\winsxs\'

  log_wiping:
    time_gap_hours: 6.0          # silence longer than this in a busy log is reported
    sparse_gap_factor: 50        # ... and must exceed this many times the log's median spacing
    anchor_window_minutes: 5.0   # a restart / sleep / clock change this close explains a gap
    min_missing_records: 1       # record-ID gaps smaller than this are ignored
    late_start_days: 1.0         # log starts this much later than the System log = history missing
    peer_log: 'System.evtx'      # the log used as the "when did this machine start" reference

# ---------------------------------------------------------------- Stage 4 detectors
  file_wiping:
    medium_at: 4
    high_at: 6
    weights:
      sdelete_mangled_name: 5      # 26-char repeating sequence (e.g. AAAAAAA.AAA)
      resident_zero_fill: 2        # deleted resident content is all 0x00 (LOW alone: Windows leaves many)
      resident_uniform_byte: 4     # deleted resident content is repeating pattern (0xFF, etc)
      random_mangled_name: 3       # deleted entry has high-entropy random name
      zero_size_deleted: 1         # deleted file truncated to 0 size
      benign_temp_name: -2         # temp files often have GUID or random-like names
      partial_content: -1          # pattern seen only in the first 64 bytes of a longer file
    min_resident_check_bytes: 8    # don't test uniform pattern on fewer bytes than this

  freespace:
    medium_at: 4
    high_at: 6
    chunk_size_bytes: 1048576      # 1 MB analysis chunk
    max_chunks_to_sample: 500      # limit scan time on large disks
    uniform_threshold_pct: 98.0    # % of bytes matching single value (0x00, 0xFF)
    high_entropy_threshold: 7.95   # Shannon entropy threshold for pseudorandom wipe
    min_consecutive_chunks: 3      # contiguous chunks needed to flag an area
    weights:
      massive_zero_fill: 2         # LOW alone: never-written space, TRIM and VM disks read as zeros
      uniform_pattern_fill: 4      # 0xFF / repeated byte across free space
      massive_high_entropy: 4      # random fill across free space

  hidden_files:
    medium_at: 4
    high_at: 6
    weights:
      ads_pe_executable: 6         # MZ executable header inside Alternate Data Stream (HIGH)
      ads_script: 4                # script (.ps1, .vbs, .bat) inside ADS (MEDIUM)
      ads_large_stream: 4          # ADS larger than 1MB or base file (MEDIUM)
      ads_unknown: 2               # unexpected named stream (LOW)
      type_spoof_executable: 6     # MZ executable with benign extension (.txt, .jpg, .log) (HIGH)
      type_spoof_archive: 4        # PK archive with non-archive extension (MEDIUM)
    benign_ads_names:
      - 'zone.identifier'
      - 'favicon'
      - 'smartscreen'
      - 'encryptable'
      - 'wofcompresseddata'
    large_stream_threshold_bytes: 1048576  # 1 MB
    ntfs_metadata_prefixes:        # NTFS's own streams ($UsnJrnl:$J, $Repair:$Corrupt ...)
      - '\$extend\'

  tool_traces:
    medium_at: 4
    high_at: 6
    weights:
      prefetch_executed: 6         # tool executed recently according to prefetch (HIGH)
      userassist_executed: 6       # tool executed according to NTUSER.DAT UserAssist (HIGH)
      registry_installed: 4        # tool listed in SOFTWARE Uninstall keys (MEDIUM)
      run_mru_command: 4           # tool command in RunMRU (MEDIUM)
      mft_file_present: 2          # tool binary or folder found in MFT (LOW)
      builtin_tool_executed: 2     # built-in Windows tool ran (LOW: Windows runs them itself)
    builtin_system_paths:          # Windows' own copies of built-in tools are not reported
      - '\windows\'
      - '$orphanfiles\'
    known_tools:
      sdelete:
        names: ['sdelete.exe', 'sdelete64.exe']
        category: 'Secure Deletion'
        description: 'Sysinternals SDelete (file and free-space wiper)'
      ccleaner:
        names: ['ccleaner.exe', 'ccleaner64.exe']
        category: 'System Cleaner / Wiper'
        description: 'Piriform CCleaner (log, artifact and free-space wiper)'
      eraser:
        names: ['eraser.exe']
        category: 'Secure Deletion'
        description: 'Eraser secure file deletion utility'
      bleachbit:
        names: ['bleachbit.exe', 'bleachbit_console.exe']
        category: 'System Cleaner / Wiper'
        description: 'BleachBit open-source system cleaner'
      timestomp:
        names: ['timestomp.exe', 'newfiletime.exe', 'newfiletime_x64.exe', 'setmace.exe', 'attributechanger.exe']
        category: 'Timestomping'
        description: 'Timestamp modification utility'
      wevtutil:
        names: ['wevtutil.exe']
        category: 'Log Manipulation'
        description: 'Windows Event Log utility (often used to clear logs)'
        builtin: true              # part of Windows: see builtin_tool_executed
      cipher:
        names: ['cipher.exe']
        category: 'Disk Wiper'
        description: 'Windows built-in cipher /w free space wiping command'
        builtin: true

# ---------------------------------------------------------------- Stage 5 analysis & ML
  analysis:
    correlation_window_minutes: 30.0   # match tool executions to actions within this window
    campaign_window_hours: 2.0         # match multi-vector activities within this window
    min_campaign_techniques: 3         # minimum distinct techniques to declare a campaign
    corroboration_score_boost: 2       # score increase when findings corroborate each other

  ml:
    log_contamination: 0.01            # expected % of anomalous events
    mft_contamination: 0.005           # expected % of anomalous MFT records
    min_records_for_ml: 50             # minimum events/records required to fit Isolation Forest


